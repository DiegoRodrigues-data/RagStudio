; Copy the sections you need into ragstudio/config/config.local.ini (git-ignored),
; or set them with: python -m ragstudio config set --section lm_studio --key base_url --value http://localhost:1234
[lm_studio]
base_url = http://localhost:1234

[embedding]
model = text-embedding-nomic-embed-text-v1.5

[llm]
model = qwen2.5-14b-instruct
temperature = 0.0
max_tokens = 1024

[experiments]
; hash the answer to a fixed prompt so the snapshot identifies the local model build (costs one call per run)
fingerprint_probe = true
