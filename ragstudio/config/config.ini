# Tracked defaults. Local values (API key, URLs) are written to config.local.ini, which is git-ignored.
# Environment overrides: RAGSTUDIO_PROVIDER=mock|openai|lmstudio|ollama, RAGSTUDIO_<SECTION>_<KEY>=value.

[provider]
# auto = LM Studio URL if set, then Ollama URL, otherwise OpenAI. `mock` is the deterministic offline provider.
default = auto
timeout_llm = 120
timeout_embedding = 60
max_retries = 4

[openai]
api_key =
base_url = https://api.openai.com/v1
# Models that go to OpenAI even when a local provider is configured (comma separated).
models_allowlist =

[lm_studio]
base_url =

[ollama]
base_url =

[embedding]
model = text-embedding-3-small
batch_size = 32
mock_dim = 96

[llm]
model = gpt-4o-mini
temperature = 0.0
max_tokens = 1024

[experiments]
seed = 42
k = 5
max_context_chars = 6000
language = pt
store = memory
retrieval_mode = dense
fingerprint_probe = false

[evaluation]
judge = false
judge_model =
